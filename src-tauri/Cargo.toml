[package]
name = "claya"
version = "0.1.0"
description = "A self-modifying Tauri app"
edition = "2021"
rust-version = "1.77.2"
# The published `claya` crate is the stub in ../crates/claya. This is the app
# binary and shares its name, so block it from ever being published by accident.
publish = false

[lib]
name = "claya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json"] }
keyring = "4"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-updater = "2.11"
